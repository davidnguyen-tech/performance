parameters:
- name: runPublicJobs
  type: boolean
  default: false
- name: runPrivateJobs
  type: boolean
  default: false
- name: runScheduledPrivateJobs
  type: boolean
  default: false
- name: onlySanityCheck
  type: boolean
  default: false
- name: gcRuntimePackageVersion
  displayName: Exact approved GC runtime package version (opt-in)
  type: string
  default: ''
- name: gcRuntimeCommit
  displayName: Source commit recorded in the GC runtime package
  type: string
  default: ''
- name: gcRuntimeBuildId
  displayName: Producer Azure DevOps build ID
  type: string
  default: ''
- name: gcRuntimeBranch
  type: string
  default: 'feature/gc/baseline'
- name: gcPerformanceQueue
  displayName: Owner-approved Ubuntu 22.04 x64 performance queue
  type: string
  default: ''

resources:
  containers:
    - container: ubuntu_x64_build_container
      image: mcr.microsoft.com/dotnet-buildtools/prereqs:ubuntu-22.04

variables:
- template: /eng/common/templates/variables/pool-providers.yml
- ${{ if and(ne(variables['System.TeamProject'], 'public'), or(ne(parameters.gcRuntimePackageVersion, ''), ne(parameters.gcRuntimeCommit, ''), ne(parameters.gcRuntimeBuildId, ''), ne(parameters.gcPerformanceQueue, ''), ne(parameters.gcRuntimeBranch, 'feature/gc/baseline'))) }}:
  - group: DotNet-HelixApi-Access

trigger:
  branches:
    include:
    - main
  paths:
    exclude: # don't trigger if only docs and similar files changed
    - docs/*
    - '**/*.md'
    - 'gc-azure-pipelines.yml'
    - src/benchmarks/gc/*

pr:
  branches:
    include:
    - main
  paths:
    exclude: # don't trigger if only docs and similar files changed
    - docs/*
    - '**/*.md'
    - scripts/benchmarks_monthly.py
    - 'gc-azure-pipelines.yml'
    - src/benchmarks/gc/*

schedules:
- cron: "0 */12 * * *"
  displayName: Every 12 hours build
  branches:
    include:
    - main
  always: true
- cron: "0 21 * * THU"
  displayName: Weekly Build
  branches:
    include:
    - main
  always: true

jobs:
  - ${{ if and(ne(variables['System.TeamProject'], 'public'), or(ne(parameters.gcRuntimePackageVersion, ''), ne(parameters.gcRuntimeCommit, ''), ne(parameters.gcRuntimeBuildId, ''), ne(parameters.gcPerformanceQueue, ''), ne(parameters.gcRuntimeBranch, 'feature/gc/baseline'))) }}:
    - template: /eng/common/core-templates/job/helix-job-monitor.yml
      parameters:
        helixAccessToken: $(HelixApiAccessToken)
        timeoutInMinutes: 540

  - template: /eng/pipelines/sdk-perf-jobs.yml
    parameters:
      gcRuntimePackageVersion: ${{ parameters.gcRuntimePackageVersion }}
      gcRuntimeCommit: ${{ parameters.gcRuntimeCommit }}
      gcRuntimeBuildId: ${{ parameters.gcRuntimeBuildId }}
      gcRuntimeBranch: ${{ parameters.gcRuntimeBranch }}
      gcPerformanceQueue: ${{ parameters.gcPerformanceQueue }}
      gcOnlySanityCheck: ${{ parameters.onlySanityCheck }}
      ${{ if or(eq(variables['System.TeamProject'], 'public'), parameters.runPublicJobs) }}:
        runPublicJobs: true
      ${{ if ne(variables['System.TeamProject'], 'public') }}:
        ${{ if or(notin(variables['Build.Reason'], 'PullRequest', 'Manual'), parameters.runPrivateJobs) }}:
          runPrivateJobs: true
        ${{ if or(eq(variables['Build.CronSchedule.DisplayName'], 'Every 12 hours build'), parameters.runScheduledPrivateJobs) }}:
          runScheduledPrivateJobs: true
      jobParameters:
        ${{ if parameters.onlySanityCheck }}:
          onlySanityCheck: true
